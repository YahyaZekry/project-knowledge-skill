<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="project-knowledge — a living knowledge folder for every project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a30"/>
      <stop offset="1" stop-color="#1a1f36"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b67d8"/>
      <stop offset="1" stop-color="#8e96e8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a4d"/>
      <stop offset="1" stop-color="#1d2340"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2c3358"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect x="0" y="626" width="1280" height="14" fill="url(#acc)"/>

  <!-- left column -->
  <g>
    <text x="80" y="200" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="58"><tspan fill="#ffffff">project</tspan><tspan fill="#8e96e8">-knowledge</tspan></text>

    <text x="80" y="264" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#c7cde8">A living knowledge folder for every project.</text>
    <text x="80" y="302" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#8492b8">One file per concern. Loaded only when relevant.</text>

    <!-- mode pills -->
    <g font-family="DejaVu Sans Mono, monospace" font-size="18">
      <rect x="80"  y="356" width="118" height="42" rx="21" fill="#232a4d" stroke="#3a4370" stroke-width="1.5"/>
      <text x="139" y="383" text-anchor="middle" fill="#c7cde8">CREATE</text>
      <rect x="212" y="356" width="126" height="42" rx="21" fill="#232a4d" stroke="#3a4370" stroke-width="1.5"/>
      <text x="275" y="383" text-anchor="middle" fill="#c7cde8">MIGRATE</text>
      <rect x="352" y="356" width="118" height="42" rx="21" fill="#232a4d" stroke="#3a4370" stroke-width="1.5"/>
      <text x="411" y="383" text-anchor="middle" fill="#c7cde8">ORIENT</text>
      <rect x="484" y="356" width="120" height="42" rx="21" fill="url(#acc)"/>
      <text x="544" y="383" text-anchor="middle" fill="#ffffff" font-weight="bold">UPDATE</text>
    </g>

    <text x="80" y="474" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#5f6c99">~ one folder. zero walls of text.</text>
  </g>

  <!-- right column: folder card -->
  <g filter="url(#shadow)">
    <!-- folder tab -->
    <path d="M 810 96 h 150 a 18 18 0 0 1 18 18 v 22 h -168 z" fill="#2c3358"/>
    <!-- folder body -->
    <rect x="760" y="128" width="420" height="392" rx="20" fill="url(#card)" stroke="#3a4370" stroke-width="2"/>
    <text x="796" y="176" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#8e96e8">.project-knowledge/</text>
    <line x1="796" y1="196" x2="1144" y2="196" stroke="#3a4370" stroke-width="1.5"/>

    <!-- INDEX.md highlighted -->
    <rect x="782" y="216" width="366" height="48" rx="10" fill="#5b67d8" opacity="0.18"/>
    <rect x="782" y="216" width="4" height="48" rx="2" fill="url(#acc)"/>
    <text x="806" y="247" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="21" fill="#ffffff">INDEX.md</text>
    <text x="1128" y="247" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#8e96e8">start here</text>

    <g font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#aeb6f2">
      <text x="806" y="306">stack.md</text>
      <text x="806" y="354">schema.md</text>
      <text x="806" y="402">hooks.md</text>
      <text x="806" y="450">roadmap.md</text>
    </g>
    <text x="1128" y="306" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#5f6c99">+9 more</text>

    <!-- progress footer inside card -->
    <rect x="796" y="478" width="336" height="10" rx="5" fill="#2c3358"/>
    <rect x="796" y="478" width="226" height="10" rx="5" fill="url(#acc)"/>
  </g>
</svg>
